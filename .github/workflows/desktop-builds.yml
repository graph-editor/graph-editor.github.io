name: Build Cross-Platform Desktop Apps

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Web Bundle
        run: pnpm build

      - name: Build Desktop Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec electron-builder --linux AppImage deb --publish never

      - name: Build Desktop Package (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm exec electron-builder --win nsis zip --publish never

      - name: Build Desktop Package (macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm exec electron-builder --mac dmg zip --publish never

      - name: Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
