[package]
name = "cp-graph-editor"
version = "2.0.0"
description = "CP Graph Visualizer & Editor"
authors = ["Mostafa <https://github.com/mostafa-cse>"]
license = "MIT"
repository = "https://github.com/graph-editor/graph-editor.github.io"
edition = "2024"
rust-version = "1.90"

[lib]
name = "cp_graph_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7" }
tauri-plugin-log = "2"
